<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>バックアップ復元</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#0b1f33;background:#f4f7fb}body{margin:0;padding:20px}.wrap{max-width:760px;margin:auto}.card{background:#fff;border:1px solid #dbe4ec;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 12px 36px rgba(11,31,51,.06)}h1{margin:0 0 8px;font-size:24px}h2{font-size:17px}.muted{color:#667789;font-size:13px}.danger{background:#fff0ef;border:1px solid #f0b8b3;border-radius:12px;padding:12px;color:#8a1c14;font-size:13px}.ok{background:#ecf8f2;border:1px solid #b7dfcf;border-radius:12px;padding:12px;color:#116340;font-size:13px}.btn,a.btn{display:inline-block;border:0;border-radius:11px;padding:11px 15px;background:#0b1f33;color:#fff;font-weight:800;text-decoration:none}.btn.ghost,a.btn.ghost{background:#fff;color:#0b1f33;border:1px solid #ccd8e2}.btn:disabled{opacity:.45}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.count{background:#f7f9fb;border-radius:10px;padding:10px}.count b{display:block;font-size:22px}.log{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:11px;background:#0b1f33;color:#d7e4ef;border-radius:12px;padding:12px;min-height:80px;max-height:260px;overflow:auto}input[type=file]{width:100%;padding:12px;border:1px dashed #9aabba;border-radius:12px}.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}.check input{margin-top:3px}@media(max-width:600px){body{padding:12px}.counts{grid-template-columns:1fr 1fr}}
</style></head><body><main class="wrap"><div class="row" style="margin-bottom:14px"><a class="btn ghost" href="./index.html">← 戻る</a></div><section class="card"><h1>バックアップ復元</h1><p class="muted">「監査」から出力した `YTM-CREW-BACKUP-1` JSONのみ受け付けます。既存データは削除せず、同じIDは更新・存在しないIDは追加します。</p><div class="danger"><b>重要：</b>この復元はDBメタデータ対象です。証明書・顔写真のファイル本体はJSONへ含まれません。現在のprivate Storageに原本が残っている場合は既存pathを再利用できますが、Storage自体を失った場合の原本復旧は別バックアップが必要です。</div></section><section class="card"><h2>1. 本人ログイン確認</h2><div id="auth">確認中…</div></section><section class="card"><h2>2. バックアップを選択</h2><input id="file" type="file" accept="application/json,.json"><div id="summary" style="margin-top:12px"></div></section><section class="card"><h2>3. 復元</h2><label class="check"><input id="confirm" type="checkbox"><span>既存データと統合されること、Storage原本そのものはこのJSONから復元されないことを確認しました。</span></label><div class="row" style="margin-top:14px"><button id="restore" class="btn" disabled>復元を実行</button></div><div id="log" class="log" style="margin-top:12px">待機中</div></section></main>
<script src="./config.js"></script><script type="module">
import {createClient} from './vendor/supabase-lite.js';
const C=window.YTM_CONFIG,sb=createClient(C.supabaseUrl,C.supabasePublishableKey),$=s=>document.querySelector(s);let backup=null,session=null,running=false;
const log=m=>{$('#log').textContent+=`\n${new Date().toLocaleTimeString('ja-JP')} ${m}`;$('#log').scrollTop=$('#log').scrollHeight};
const arr=(o,k)=>Array.isArray(o?.[k])?o[k]:[];
function valid(o){return o&&o.schema==='YTM-CREW-BACKUP-1'&&['partners','attendance','documents','worker_profiles','profile_photos'].every(k=>Array.isArray(o[k]))}
function cleanPartner(r){const x={...r};delete x.payment_daily_rate;delete x.owner_id;delete x.created_at;delete x.updated_at;return x}
function cleanAttendance(r){const x={...r};delete x.amount;delete x.total_amount;delete x.owner_id;delete x.created_at;delete x.updated_at;x.voided_by=x.voided_at?session.user.id:null;return x}
function cleanGeneric(r){const x={...r};delete x.owner_id;delete x.created_at;delete x.updated_at;return x}
async function upsertChunks(table,rows,clean,onConflict){for(let i=0;i<rows.length;i+=100){const chunk=rows.slice(i,i+100).map(clean);let q=sb.from(table).upsert(chunk,onConflict?{onConflict}:{});const r=await q;if(r.error)throw new Error(`${table}: ${r.error.message}`);log(`${table} ${Math.min(i+chunk.length,rows.length)}/${rows.length}`)}}
async function checkAuth(){const r=await sb.auth.getSession();session=r.data.session;$('#auth').innerHTML=session?'<div class="ok">本人ログインを確認しました。</div>':'<div class="danger">ログインされていません。先にメイン画面の「接続設定」から本人ログインしてください。</div>';refreshButton()}
function refreshButton(){$('#restore').disabled=!session||!backup||!$('#confirm').checked||running}
$('#file').onchange=async e=>{backup=null;$('#summary').innerHTML='';try{const text=await e.target.files[0].text(),o=JSON.parse(text);if(!valid(o))throw new Error('YTM-CREW-BACKUP-1形式ではありません');backup=o;const pairs=[['協力会社','partners'],['出面','attendance'],['証明書','documents'],['作業員','worker_profiles'],['顔写真情報','profile_photos']];$('#summary').innerHTML='<div class="ok">形式確認済み</div><div class="counts" style="margin-top:10px">'+pairs.map(([l,k])=>`<div class="count"><span>${l}</span><b>${arr(o,k).length}</b></div>`).join('')+'</div><p class="muted">出力日時: '+String(o.exported_at||'不明')+'</p>';log('バックアップ形式を確認');}catch(err){backup=null;$('#summary').innerHTML=`<div class="danger">${err.message}</div>`;log('読込失敗: '+err.message)}refreshButton()};
$('#confirm').onchange=refreshButton;
$('#restore').onclick=async()=>{if(running||!backup||!session)return;running=true;refreshButton();$('#log').textContent='復元開始';try{await upsertChunks('partners',arr(backup,'partners'),cleanPartner);await upsertChunks('worker_profiles',arr(backup,'worker_profiles'),cleanGeneric,'partner_id');await upsertChunks('attendance',arr(backup,'attendance'),cleanAttendance);await upsertChunks('documents',arr(backup,'documents'),cleanGeneric);await upsertChunks('profile_photos',arr(backup,'profile_photos'),cleanGeneric,'partner_id');log('DBメタデータ復元完了');log('メイン画面を再読込して監査してください');alert('復元処理が完了しました。メイン画面を再読込して監査してください。')}catch(err){log('停止: '+err.message);alert('復元を停止しました。ログを確認してください。')}finally{running=false;refreshButton()}};
checkAuth();
</script></body></html>
