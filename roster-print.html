<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作業員名簿出力</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#111}body{margin:16px;background:#f4f7fb}.toolbar{background:#fff;border:1px solid #dbe4ec;border-radius:14px;padding:14px;margin-bottom:14px;display:flex;gap:10px;align-items:end;flex-wrap:wrap}.toolbar label{display:grid;gap:4px;font-size:12px}.toolbar input{padding:8px;border:1px solid #ccd8e2;border-radius:8px}.toolbar button,.toolbar a{padding:9px 12px;border:0;border-radius:9px;background:#0b1f33;color:#fff;text-decoration:none;font-weight:700}.toolbar a{background:#fff;color:#0b1f33;border:1px solid #ccd8e2}.status{font-size:12px;color:#657586}.sheet{background:#fff;padding:8mm;box-shadow:0 8px 30px rgba(0,0,0,.08);overflow:auto}.header{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;margin-bottom:8px}.header h1{text-align:center;font-size:20px;margin:0}.header .right{text-align:right;font-size:11px}.header .left{font-size:11px}.note{font-size:9px;margin:4px 0 8px}.warn{color:#9a6700;font-weight:700}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:2400px;font-size:7px}th,td{border:1px solid #111;padding:3px 4px;white-space:nowrap;text-align:center}th{background:#f1f1f1;font-weight:700}.left{text-align:left}.missing{background:#fff2cc}.no-print{display:block}@page{size:A3 landscape;margin:6mm}@media print{body{margin:0;background:#fff}.toolbar,.no-print{display:none!important}.sheet{padding:0;box-shadow:none}.tablewrap{overflow:visible}table{min-width:0;width:100%;font-size:5.5px}th,td{padding:2px 2px}.header h1{font-size:16px}}
</style></head><body>
<div class="toolbar"><a href="./index.html">← 戻る</a><label>事業所の名称<input id="siteName" placeholder="例：○○現場"></label><label>会社名<input id="companyName" value="山﨑塗装"></label><button id="reload">最新データ読込</button><button id="print">印刷 / PDF</button><span id="status" class="status">読込中…</span></div>
<section class="sheet"><div class="header"><div class="left">事業所の名称：<b id="siteOut"></b></div><h1>作業員名簿</h1><div class="right">作成日：<span id="created"></span><br>会社名：<b id="companyOut">山﨑塗装</b></div></div><div class="note">全建統一様式第5号（改訂6版・令和6年10月）の項目体系を基準に正本DBから生成する内部標準帳票です。元請指定様式がある場合は同じ正本から転記します。<span id="quality" class="warn"></span></div><div class="tablewrap"><table><thead><tr>
<th>No.</th><th>フリガナ</th><th>氏名</th><th>職種</th><th>所属事業者と異なる事業者の元で就業した場合</th><th>雇入年月日</th><th>技能者ID</th><th>生年月日</th><th>経験年数</th><th>年齢</th><th>現住所</th><th>本人TEL</th><th>家族連絡先</th><th>家族連絡先TEL</th><th>最近の健康診断日</th><th>血圧</th><th>血液型</th><th>特殊健康診断日</th><th>特殊健康診断種類</th><th>健康保険</th><th>年金保険</th><th>雇用保険</th><th>建設業退職金共済制度</th><th>中小企業退職金共済制度</th><th>技能レベル</th><th>在留資格</th><th>雇入・職長特別教育</th><th>技能講習</th><th>免許</th><th>入場年月日</th><th>受入教育実施年月日</th><th>情報状態</th>
</tr></thead><tbody id="rows"></tbody></table></div></section>
<script src="./config.js"></script><script type="module">
import {createClient} from './vendor/supabase-lite.js';
const C=window.YTM_CONFIG,sb=createClient(C.supabaseUrl,C.supabasePublishableKey),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function age(b){if(!b)return '';const d=new Date(b+'T00:00:00'),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a>=0?a:''}
function fmt(d){return d?String(d).slice(0,10).replaceAll('-','/'):''}
function extra(w,k){return w?.roster_extra?.[k]??''}
async function cache(){return new Promise((resolve)=>{const r=indexedDB.open('ytmCrewLedger',2);r.onerror=()=>resolve(null);r.onsuccess=()=>{const db=r.result,tx=db.transaction('meta','readonly'),q=tx.objectStore('meta').get('snapshot');q.onsuccess=()=>resolve(q.result?.data||null);q.onerror=()=>resolve(null)}})}
async function load(){
 $('#status').textContent='読込中…';let partners=[],workers=[],source='';
 const {data:{session}}=await sb.auth.getSession();
 if(session&&navigator.onLine){const [p,w]=await Promise.all([sb.from('partners').select('*').order('display_name'),sb.from('worker_profiles').select('*')]);if(!p.error&&!w.error){partners=p.data||[];workers=w.data||[];source='クラウド正本'}}
 if(!source){const c=await cache();partners=c?.partners||[];workers=c?.workers||[];source=c?'端末保存データ':'データなし'}
 const map=new Map(workers.map(w=>[w.partner_id,w]));let missing=0;
 $('#rows').innerHTML=partners.map((p,i)=>{const w=map.get(p.id)||{},x=w.roster_extra||{};const cells=[i+1,w.furigana,p.full_name,w.occupation,x.other_employer,w.hire_date,w.ccus_skill_worker_id,p.birth_date,w.experience_years,age(p.birth_date),p.address,p.phone,x.family_contact_name,x.family_contact_phone,w.last_health_check_date,x.blood_pressure,x.blood_type,x.special_health_check_date,x.special_health_check_type,w.health_insurance,w.pension,w.employment_insurance,w.retirement_mutual_aid,x.small_business_retirement_aid,x.skill_level,x.residence_status,x.special_training,x.skill_training,x.license,x.entry_date,x.acceptance_training_date,w.verification_state||'未確認'];if(!w.occupation||!p.birth_date||!p.address||!p.phone)missing++;return '<tr>'+cells.map((v,j)=>`<td class="${(!v&&[2,3,7,10,11].includes(j))?'missing':''} ${[2,10].includes(j)?'left':''}">${esc(j===5||j===7||j===14||j===17||j===29||j===30?fmt(v):v)}</td>`).join('')+'</tr>'}).join('');
 $('#quality').textContent=missing?` 要確認 ${missing}名（主要項目不足あり）`:' 主要項目不足なし';$('#status').textContent=`${source}・${partners.length}名`;$('#created').textContent=new Date().toLocaleDateString('ja-JP');
}
function syncHeader(){ $('#siteOut').textContent=$('#siteName').value;$('#companyOut').textContent=$('#companyName').value||'山﨑塗装'}
$('#siteName').oninput=syncHeader;$('#companyName').oninput=syncHeader;$('#reload').onclick=load;$('#print').onclick=()=>{syncHeader();window.print()};syncHeader();load();
</script></body></html>
